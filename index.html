<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS 功能学习台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f7fd1'/%3E%3Ctext x='32' y='45' font-size='34' font-weight='700' text-anchor='middle' fill='%23fff' font-family='Arial,sans-serif'%3EPs%3C/text%3E%3C/svg%3E">
<style>
:root{
  --menubar:#2b2b2b; --panel:#2b2b2b; --panel-hover:#3f3f3f; --text-dark:#d5d5d5;
  --accent:#3a6ea5; --accent2:#5a9bd4; --canvas-bg:#767676;
  --optbar:#3a3a3a; --line:#c9c9c9;
  --cat-select:#5a9bd4; --cat-repair:#6fbf73; --cat-color:#e8a13c; --cat-layer:#9d7bd8;
  --cat-text:#7fa4c9; --cat-effect:#58b8c9; --cat-output:#b08968; --cat-portrait:#e07a5f;
  --paper:#fdfdfd;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:13px;color:#333;background:#1c1c1c;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
::selection{background:rgba(90,155,212,.4)}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#4d4d4d;border-radius:5px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:#6a6a6a;border:2px solid transparent;background-clip:padding-box}
#app{display:flex;flex-direction:column;height:100vh;opacity:0;transition:opacity .45s ease}
#app.on{opacity:1}

/* ===== 菜单栏 ===== */
#menubar{height:30px;background:linear-gradient(180deg,rgba(50,52,58,.9),rgba(40,42,47,.94));backdrop-filter:blur(12px) saturate(1.15);display:flex;align-items:center;padding:0 6px;gap:1px;flex-shrink:0;z-index:50;border-bottom:1px solid rgba(255,255,255,.08)}
.menu{position:relative}
.menu>button{background:none;border:none;color:#d0d0d0;font-size:12.5px;padding:4px 9px;border-radius:2px;white-space:nowrap;cursor:pointer;transition:background .12s,color .12s}
.menu>button::after{content:"";display:inline-block;width:6px;height:6px;margin-left:6px;border-right:1.4px solid currentColor;border-bottom:1.4px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.65}
.menu>button:hover,.menu.open>button{background:var(--accent);color:#fff}
.menu>button.sel{background:var(--accent);color:#fff}
.dropdown{position:fixed;min-width:200px;background:linear-gradient(165deg,rgba(76,79,87,.86),rgba(38,40,46,.92) 55%,rgba(52,54,60,.88));backdrop-filter:blur(22px) saturate(1.35);border:1px solid rgba(255,255,255,.16);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 26px rgba(255,255,255,.045),0 20px 50px rgba(0,0,0,.55),0 6px 16px rgba(0,0,0,.32);padding:6px;z-index:200;display:none}
.menu.open>.dropdown{display:block}
.dropdown button{display:block;width:100%;text-align:left;background:none;border:none;color:#e6e6e6;font-size:13px;padding:7px 12px;border-radius:7px;cursor:pointer}
.dropdown button:hover{background:linear-gradient(180deg,rgba(74,124,175,.92),rgba(56,102,156,.92));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 4px rgba(24,52,88,.35)}
.dropdown .dsep{height:1px;background:rgba(255,255,255,.09);margin:5px 6px}
.menu-right{margin-left:auto;display:flex;align-items:center;gap:8px;padding-right:2px}
#searchWrap{position:relative}
#searchInput{width:196px;height:22px;background:#1f1f1f;border:1px solid #4a4a4a;border-radius:3px;color:#e2e2e2;font-size:12px;padding:0 8px;outline:none}
#searchInput:focus{border-color:var(--accent2)}
#searchDrop{position:fixed;width:min(330px,calc(100vw - 20px));max-height:60vh;overflow:auto;background:#2b2b2b;border:1px solid #4a4a4a;box-shadow:0 6px 18px rgba(0,0,0,.55);z-index:200;display:none}
#searchDrop.on{display:block}
.sr-item{padding:7px 12px;color:#d9d9d9;font-size:12.5px;cursor:pointer;display:flex;gap:8px;align-items:center}
.sr-item:hover{background:var(--accent)}
.sr-item .sr-k{margin-left:auto;color:#8f8f8f;font-size:11px;font-family:ui-monospace,Consolas,monospace}
.sr-empty{padding:12px;color:#999;font-size:12.5px}
/* 搜索：分组标题 / 历史 / 热门 */
.sr-group{padding:8px 12px 3px;font-size:10.5px;color:#7d828b;letter-spacing:.6px;display:flex;align-items:center}
.sr-group .sr-clear{margin-left:auto;letter-spacing:0;color:#8a8f97;font-size:11px;cursor:pointer;padding:2px 7px;border-radius:4px}
.sr-group .sr-clear:hover{color:#fff;background:#3a3f46}
.sr-hist{display:flex;align-items:center;gap:8px;padding:7px 12px;color:#d9d9d9;font-size:12.5px;cursor:pointer}
.sr-hist:hover{background:var(--accent)}
.sr-hist .sr-del{margin-left:auto;color:#777;font-size:14px;padding:0 5px;border-radius:3px;line-height:1.2}
.sr-hist .sr-del:hover{color:#ff8a8a;background:#3a3f46}
.sr-hot{padding:7px 12px;color:#d9d9d9;font-size:12.5px;cursor:pointer;display:flex;gap:8px;align-items:center}
.sr-hot:hover{background:var(--accent)}
.sr-hot .sr-fire{color:#e8a13c;font-size:11px}
.sr-hot .sr-k{margin-left:auto;color:#8f8f8f;font-size:11px;font-family:ui-monospace,Consolas,monospace}
#guideBtn{background:var(--accent);border:none;color:#fff;font-size:12px;padding:4px 12px;border-radius:3px;white-space:nowrap}
#guideBtn:hover{background:#4a80bd}
#panelToggle{display:none;background:none;border:1px solid #4a4a4a;color:#ccc;border-radius:3px;width:26px;height:22px;font-size:11px}
#panelToggle:hover{background:#3f3f3f}

/* ===== 选项栏 ===== */
#optionsbar{height:36px;background:var(--optbar);border-bottom:1px solid #242424;display:flex;align-items:center;gap:10px;padding:0 12px;flex-shrink:0;overflow-x:auto;white-space:nowrap}
#optIcon{width:22px;height:22px;flex-shrink:0;color:#dfe7ef}
#optName{font-size:13px;font-weight:600;color:#f0f0f0;letter-spacing:.2px}
#optKey{background:#4a4a4a;color:#ffe9a8;font-size:11px;padding:1px 7px;border-radius:3px;font-family:ui-monospace,Consolas,monospace;border:1px solid #5c5c5c}
#optDesc{font-size:12px;color:#a8b2bc;overflow:hidden;text-overflow:ellipsis}
#optBtn{margin-left:auto;background:#4a4a4a;border:1px solid #5d5d5d;border-radius:3px;font-size:12px;padding:3px 12px;color:#e8e8e8;flex-shrink:0;transition:background .12s,border-color .12s}
#optBtn:hover{background:var(--accent);border-color:var(--accent2);color:#fff}

/* ===== 工作区 ===== */
#workspace{flex:1;display:flex;min-height:0}
#toolbar{width:88px;background:var(--menubar);padding:5px 0 0;display:flex;flex-direction:column;flex-shrink:0;transition:width .18s ease}
#toolScroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;width:100%;display:flex;flex-direction:column;align-items:center;padding:0 3px 4px}
#colToggle{flex-shrink:0;background:#383838;border:1px solid #565656;color:#dcdcdc;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:3px;width:100%;margin-bottom:2px}
#colToggle svg{width:15px;height:15px}
#colToggle:hover{background:var(--accent);color:#fff;border-color:var(--accent2)}
#colToggle.on{background:var(--accent);color:#fff;border-color:var(--accent2)}
#toolTip{position:fixed;background:linear-gradient(180deg,rgba(62,64,70,.93),rgba(44,46,51,.97));backdrop-filter:blur(10px) saturate(1.2);border:1px solid rgba(255,255,255,.14);color:#eee;padding:4px 9px;font-size:12px;border-radius:4px;white-space:nowrap;z-index:300;pointer-events:none;display:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 4px 14px rgba(0,0,0,.4)}
#toolBtns{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;width:100%}
#toolBtns .tsep{grid-column:1/-1;height:1px;background:#3d3d3d;margin:2px 4px;flex-shrink:0}
.tool-btn{width:100%;height:26px;display:flex;align-items:center;justify-content:center;color:#d6d6d6;border-radius:2px;position:relative;cursor:pointer;background:none;border:none;flex-shrink:0;min-width:0}
.tool-btn:hover{background:var(--accent);color:#fff}
.tool-btn.active{background:var(--accent);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.tool-btn svg{width:16px;height:16px}
/* 悬浮提示改为 fixed 浮层（受滚动容器裁切会显示不全），JS 控制定位与收拢 */
/* 单列模式（点 #colToggle 切换，同 PS 工具栏双箭头） */
#app.cols-single #toolbar{width:42px}
#app.cols-single #toolScroll{padding:0 2px 4px}
#app.cols-single #toolBtns{grid-template-columns:1fr}
#app.cols-single .tool-btn{height:22px}
#app.cols-single .tool-btn svg{width:14px;height:14px}
#app.cols-single .tool-btn::after{left:40px}
.swatchStack{margin-top:auto;flex-shrink:0;padding:4px 4px 2px}
.sw-stack{position:relative;width:32px;height:32px;margin:0 auto;cursor:pointer}
.sw-stack .sw-back{position:absolute;right:0;bottom:0;width:22px;height:22px;background:#fff;border:1px solid #666;border-radius:2px}
.sw-stack .sw-front{position:absolute;left:0;top:0;width:22px;height:22px;background:#222;border:1px solid #aaa;border-radius:2px}
.sw-row{display:flex;justify-content:center;gap:8px;margin-top:4px}
.sw-mini{background:none;border:none;color:#8f8f8f;font-size:11px;font-family:ui-monospace,Consolas,monospace;padding:1px 5px;border-radius:2px;cursor:pointer}
.sw-mini:hover{background:var(--panel-hover);color:#eee}

#canvasArea{flex:1;min-width:0;background:radial-gradient(1300px 900px at 50% 20%,#3d3d3d,#1e1e1e 75%);overflow:auto;padding:26px;display:flex;align-items:flex-start;justify-content:center}
#doc{background:var(--paper);width:100%;max-width:1050px;box-shadow:0 30px 70px rgba(0,0,0,.55),0 4px 16px rgba(0,0,0,.35);border-radius:2px;transform-origin:top left;transition:transform .18s ease}
#docInner{padding:20px 26px 30px;position:relative}

#panel{width:235px;background:linear-gradient(180deg,rgba(46,48,54,.93),rgba(34,36,41,.97));backdrop-filter:blur(14px) saturate(1.2);flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,.1);z-index:5}
.panel-tabs{display:flex;flex-shrink:0;background:#262626;border-bottom:1px solid #1f1f1f}
.ptab{flex:1;text-align:center;padding:7px 0;color:#9b9b9b;font-size:12px;background:transparent;border-right:1px solid #202020;cursor:pointer;transition:color .12s,background .12s}
.ptab:last-child{border-right:none}
.ptab:hover{color:#e8e8e8;background:#303030}
.ptab.active{background:var(--accent);color:#fff;box-shadow:inset 0 -2px 0 #b8d4ef}
.panel-head{padding:7px 10px;color:#9a9a9a;font-size:11.5px;border-bottom:1px solid #383838;flex-shrink:0;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.panel-head::before{content:"";width:3px;height:10px;background:var(--accent2);border-radius:1px;display:inline-block}
.panel-body{flex:1;overflow-y:auto;padding:5px 6px 10px}
.pitem{display:flex;align-items:center;gap:8px;padding:6px 8px;color:#d4d4d4;font-size:12.5px;border-radius:3px;cursor:pointer;transition:background .12s}
.pitem:hover{background:#3d4f63}
.pitem.active{background:var(--accent);color:#fff}
.pitem .p-k{margin-left:auto;color:#888;font-size:11px;font-family:ui-monospace,Consolas,monospace}
.pitem.active .p-k{color:#dbe7f3}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ===== 状态栏 ===== */
#statusbar{height:25px;background:var(--menubar);color:#b9b9b9;font-size:12px;display:flex;align-items:center;padding:0 10px;gap:16px;flex-shrink:0;z-index:50}
#zoomBtn{padding:0 8px;border-right:1px solid #3d3d3d;cursor:pointer;user-select:none;font-family:ui-monospace,Consolas,monospace}
#zoomBtn:hover{color:#fff}
#docInfo{color:#8f8f8f;font-size:11.5px}
#tipBox{margin-left:auto;overflow:hidden;max-width:520px;height:20px;position:relative;flex:1;text-align:right}
#tipText{display:inline-block;white-space:nowrap;opacity:1;transition:opacity .3s}
#tipText.swap{opacity:0}

/* ===== 欢迎页 ===== */
#welcome{display:flex;flex-direction:column;gap:14px}
.doc-welcome{background:#1e2228;box-shadow:none}
.doc-welcome #docInner{padding:0}
/* 欢迎页首屏：深色专业 UI，PS 元素暗纹背景 */
.welcome{position:relative;overflow:hidden;background:#1e2228;min-height:64vh;padding:38px 30px 20px;display:flex;flex-direction:column}
.w-bg{position:absolute;inset:0;pointer-events:none;z-index:0}
.w-tex{position:absolute;inset:0;width:100%;height:100%;opacity:.15}
.w-antwrap{position:absolute;top:16px;right:16px;z-index:1;opacity:.8}
.w-antbox{width:108px;height:80px;display:block;filter:drop-shadow(0 0 10px rgba(90,155,212,.35));animation:antMove 1.2s linear infinite}
.w-antlabel{display:block;position:absolute;top:-22px;left:0;font-size:11px;color:#8fa3b8;white-space:nowrap}
@keyframes antMove{to{stroke-dashoffset:-22}}
.w-main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:13px;text-align:center;padding:6vh 0 2vh}
.w-main h1{font-size:30px;font-weight:700;color:#fff;letter-spacing:-.01em}
.w-main .w-sub{font-size:14px;color:#c5c8ce;line-height:1.7;max-width:560px}
.w-cta{background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;padding:12px 36px;cursor:pointer;box-shadow:0 10px 26px rgba(37,99,235,.4);transition:background .15s,transform .15s,box-shadow .15s}
.w-cta:hover{background:#2f6df0;transform:translateY(-1px);box-shadow:0 12px 30px rgba(37,99,235,.5)}
.w-hint{font-size:12.5px;color:#7d848e;margin-top:2px}
.w-cards{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px}
.w-card2{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:14px 16px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28);transition:transform .15s,border-color .15s,background .15s,box-shadow .15s}
.w-card2:hover{transform:translateY(-2px);border-color:rgba(90,155,212,.5);background:rgba(90,155,212,.09);box-shadow:0 10px 24px rgba(0,0,0,.34)}
.w-card2.hot{border-color:rgba(37,99,235,.5);background:rgba(37,99,235,.1);box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06)}
.w-card2.hot:hover{border-color:#2563eb;background:rgba(37,99,235,.16)}
.w-card2 b{display:block;font-size:13.5px;color:#e8eaed;font-weight:600;margin-bottom:4px;line-height:1.4}
.w-card2 span{font-size:12px;color:#9aa0a8;line-height:1.5;display:block}
.w-scroll{position:relative;z-index:2;margin-top:auto;padding-top:16px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#7d848e}
.w-scroll svg{width:13px;height:13px;color:#7d848e}
/* ===== 动效体系（克制、回应用操作） ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
@keyframes menuDrop{from{opacity:0;transform:translateY(5px) scale(.97);transform-origin:top}to{opacity:1;transform:none}}
@keyframes sunBreathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.09);opacity:.86}}
@keyframes ripple{0%{transform:scaleX(1);opacity:.38}70%{opacity:.12}100%{transform:scaleX(1.32);opacity:0}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(60px)}}
.menu.open>.dropdown{animation:menuDrop .18s ease-out}
#welcome{animation:fadeUp .32s ease-out}
.lesson{animation:fadeUp .3s ease-out}
.pitem{animation:fadeIn .24s ease-out both}
.w-chip{transition:transform .16s ease,border-color .16s,box-shadow .16s}
.w-chip:hover{transform:translateY(-2px)}
.w-card{animation:fadeUp .45s .12s ease-out both}
.w-sun{animation:sunBreathe 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w-ripple{animation:ripple 5.5s ease-out infinite;transform-box:fill-box;transform-origin:center}
.w-cloud{animation:drift 26s ease-in-out infinite alternate}
.w-cloud.c2{animation-duration:38s;animation-delay:-12s}
.modal.open .modal-box{animation:popIn .22s ease-out}
.modal.open{animation:fadeIn .18s ease-out}
@keyframes ants{to{stroke-dashoffset:-22}}
.ants{stroke-dasharray:7 5;animation:ants .9s linear infinite}
.ants2{stroke-dasharray:7 5;stroke-dashoffset:-4;animation:ants 1.15s linear infinite}

/* ===== 课程卡片（PS 面板风格深色主题） ===== */
#doc.dark{background:transparent;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.lesson{display:flex;flex-direction:row;gap:20px;align-items:flex-start;position:relative;background:#2b2b2b;border:1px solid #3a3a3a;border-radius:10px;padding:24px;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.lesson::before{content:"";position:absolute;left:6%;right:6%;top:0;height:34%;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0));border-radius:10px 10px 0 0;pointer-events:none}
.lesson>*{position:relative;z-index:1}
.lesson-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:16px}
/* ===== 相似工具对比 ===== */
.cmp-wrap{display:flex;flex-direction:column;gap:16px;animation:fadeUp .3s ease-out}
.cmp-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cmp-title{font-size:19px;font-weight:700;color:#fff;letter-spacing:-.2px}
.cmp-sub{font-size:12px;color:#8f97a0;margin-left:2px}
.cmp-count{margin-left:auto;font-size:11.5px;color:#7d828b;font-family:ui-monospace,Consolas,monospace;background:#1f2329;border:1px solid #3a3f46;padding:3px 10px;border-radius:20px}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
.cmp-card{position:relative;border:1px solid #3a3a3a;border-radius:12px;background:#26292f;padding:16px 16px 14px;box-shadow:0 8px 20px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;overflow:hidden}
.cmp-card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px}
.cmp-card.ca::before{background:linear-gradient(90deg,#5a9bd4,#7fb3e8)}
.cmp-card.cb::before{background:linear-gradient(90deg,#e8a13c,#f2c078)}
.cmp-cardhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cmp-ico{width:30px;height:30px;border-radius:7px;background:#20242a;border:1px solid #3a3f46;display:flex;align-items:center;justify-content:center;color:#cfe0f2;flex-shrink:0}
.cmp-ico svg{width:18px;height:18px}
.cmp-name{font-size:15px;font-weight:600;color:#f2f4f7}
.cmp-en{font-size:11px;color:#8f97a0;font-family:ui-monospace,Consolas,monospace}
.cmp-key{margin-left:auto;font-size:11px;color:#ffd97a;background:#1f2329;border:1px solid #3a3f46;border-radius:5px;padding:2px 8px;font-family:ui-monospace,Consolas,monospace}
.cmp-desc{font-size:12.5px;color:#b8bec6;line-height:1.65}
.cmp-demo{display:flex;align-items:center;justify-content:center;min-height:120px;background:#1c1f24;border-radius:9px;border:1px solid #33383f;padding:8px}
.cmp-demo svg{width:100%;max-height:130px}
.cmp-sec b{display:block;font-size:11.5px;color:#9aa3ad;letter-spacing:.4px;margin-bottom:6px}
.cmp-sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.cmp-sec li{font-size:12.5px;color:#c6cbd2;padding-left:14px;position:relative;line-height:1.55}
.cmp-sec li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:#5a9bd4}
.cmp-card.cb .cmp-sec li::before{background:#e8a13c}
.cmp-card-cta{margin-top:auto;padding-top:4px}

/* 演示动画基元 */
@keyframes dStroke{from{stroke-dashoffset:var(--dl,220)}to{stroke-dashoffset:0}}

@keyframes dPop{0%{opacity:0;transform:scale(.35)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes dPulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes dFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dBlur{0%,100%{filter:blur(0)}35%,70%{filter:blur(3.5px)}}
@keyframes dGrow{from{transform:scale(.92)}to{transform:scale(1.08)}}
@keyframes dAnts{to{stroke-dashoffset:-22}}
@keyframes dType{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes dDrop{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:none}}
.dm-stroke{stroke-dasharray:var(--dl,220);animation:dStroke 1.6s ease-out forwards}
.dm-move{animation:dMove 1.8s ease-in-out infinite alternate}
.dm-pop{animation:dPop .9s ease-out forwards}
.dm-pulse{animation:dPulse 1.6s ease-in-out infinite}
.dm-fill{transform-origin:left center;animation:dFill 1.4s ease-out forwards}
.dm-blur{animation:dBlur 2.4s ease-in-out infinite}
.dm-grow{transform-origin:center;animation:dGrow 1.2s ease-in-out infinite alternate}
.dm-ant{stroke-dasharray:7 5;animation:dAnts .8s linear infinite}
.dm-type{animation:dType 1.8s steps(14) forwards;transform-origin:left}
.dm-drop{animation:dDrop .4s ease-out forwards}
/* 照片效果动画（真实素材演示） */
@keyframes dHue{0%,100%{filter:hue-rotate(0)}50%{filter:hue-rotate(140deg)}}
@keyframes dSat{0%,100%{filter:saturate(1)}50%{filter:saturate(.08)}}
@keyframes dBw{0%,100%{filter:grayscale(0)}50%{filter:grayscale(1)}}
@keyframes dCon{0%,100%{filter:contrast(1)}50%{filter:contrast(1.55) brightness(1.05)}}
@keyframes dBri{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
@keyframes dSep{0%,100%{filter:sepia(0)}50%{filter:sepia(.9) hue-rotate(-14deg)}}
@keyframes dBlurSoft{0%,100%{filter:blur(0) brightness(1)}45%,70%{filter:blur(2.2px) brightness(1.02)}}
@keyframes dScan{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}
@keyframes dSlider{from{transform:translateX(-20px)}to{transform:translateX(30px)}}
@keyframes dFadeHold{0%,72%{opacity:0}100%{opacity:1}}
@keyframes dShrinkW{from{transform:scaleX(1)}to{transform:scaleX(.62)}}
.dm-hue{animation:dHue 2.4s ease-in-out infinite}
.dm-sat{animation:dSat 2.4s ease-in-out infinite}
.dm-bw{animation:dBw 2.2s ease-in-out infinite}
.dm-con{animation:dCon 2.2s ease-in-out infinite}
.dm-bri{animation:dBri 2.4s ease-in-out infinite}
.dm-sep{animation:dSep 2.6s ease-in-out infinite}
.dm-soft{animation:dBlurSoft 2.6s ease-in-out infinite}
.dm-scan{animation:dScan 2.4s ease-in-out infinite}
.dm-slide{animation:dSlider 1.9s ease-in-out infinite alternate}
.dm-fadehold{animation:dFadeHold 2.6s ease-out forwards}
.dm-shrinkw{transform-origin:center;animation:dShrinkW 1.5s ease-in-out infinite alternate}
.demo-pane .dm-stroke,.demo-pane .dm-move,.demo-pane .dm-pop,.demo-pane .dm-pulse,.demo-pane .dm-fill,.demo-pane .dm-blur,.demo-pane .dm-grow,.demo-pane .dm-ant,.demo-pane .dm-type,.demo-pane .dm-drop,.demo-pane .dm-hue,.demo-pane .dm-sat,.demo-pane .dm-bw,.demo-pane .dm-con,.demo-pane .dm-bri,.demo-pane .dm-sep,.demo-pane .dm-soft,.demo-pane .dm-scan,.demo-pane .dm-slide,.demo-pane .dm-fadehold,.demo-pane .dm-shrinkw{will-change:transform,opacity,filter}

function openLesson(id, opts){
  opts = opts || {};
  current = id;
  currentCompare = null;
  closeAllMenus();
  const t = TOOLS[id];
  renderCanvas();
  renderOptions();
  renderToolbar();
  renderPanel();
  renderSearch();
  if(!opts.silent) $('canvasArea').scrollTop = 0;
}
function renderCanvas(){
  const el = $('docInner');
  const doc = $('doc');
  if(currentCompare){ renderCompare(); return; }
  if(!current){ doc.className='dark doc-welcome'; el.innerHTML = renderWelcome(); return; }
  const t = TOOLS[current];
  if(!t){ doc.className='dark doc-welcome'; el.innerHTML = renderWelcome(); return; }
  doc.classList.remove('doc-welcome');
  doc.classList.add('dark');
  let html = '<div class="lesson"><div class="lesson-main"><div class="lhead">';
  html += '<div class="licon">'+(ICONS[t.icon]||ICONS.shortcuts)+'</div>';
  html += '<span class="lname">'+t.name+'</span><span class="len">'+t.en+'</span>';
  if(t.key) html += '<span class="lkey">'+t.key+'</span>';
  html += '<span class="lcat" style="background:'+catColor(t.c)+'">'+t.cat+'</span></div>';
  const fallback = Array.isArray(t.when) ? t.when[0] : '';
  html += '<div class="ldesc">'+(t.desc||fallback)+'</div>';
  if(Array.isArray(t.when) && t.when.length) html += '<div class="lsec"><h4>什么时候用它</h4><ul>'+t.when.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';
  if(Array.isArray(t.steps) && t.steps.length) html += '<div class="lsec"><h4>怎么用</h4><ol>'+t.steps.map(x=>'<li>'+x+'</li>').join('')+'</ol></div>';
  if(t.demo && t.demo==='table' && t.table){
    html += '<div class="lsec"><h4>快捷键速查</h4><table class="skeys"><colgroup><col style="width:34%"><col style="width:16%"><col style="width:34%"><col style="width:16%"></colgroup><tr><th>工具 / 命令</th><th>快捷键</th><th>工具 / 命令</th><th>快捷键</th></tr>';
    t.table.forEach(r=>{ html += '<tr><td>'+r[0]+'</td><td><kbd>'+r[1]+'</kbd></td><td>'+r[2]+'</td><td><kbd>'+r[3]+'</kbd></td></tr>'; });
    html += '</table></div>';
  }
  if(Array.isArray(t.tips) && t.tips.length){
    const tipHtml = t.tips.map(x=>'<li>'+String(x).replace(/【([^】]+)】/g,'<span class="hk">$1</span>')+'</li>').join('');
    html += '<div class="lsec"><h4>💡 小贴士</h4><ul>'+tipHtml+'</ul></div>';
  }
  if(t.rel && t.rel.length){
    html += '<div class="lsec"><h4>🔗 相关功能</h4><div class="related">';
    t.rel.forEach(r=>{ if(TOOLS[r]) html += '<button class="chip" data-goto="'+r+'">'+TOOLS[r].name+'</button>'; });
    html += '</div></div>';
  }
  const relCmp = COMPARES.filter(c=> c.a===current || c.b===current);
  if(relCmp.length){
    html += '<div class="lsec"><h4>对比学习</h4><div class="related">';
    relCmp.forEach(c=>{ html += '<button class="chip" data-cmp="'+c.id+'">'+c.title+'</button>'; });
    html += '</div></div>';
  }
  html += '</div>';
  const demo = animSvg(current);
  if(demo){
    const cap = t.desc || (Array.isArray(t.when) ? t.when[0] : '');
    html += '<aside class="demo-pane"><div class="dp-head">功能演示</div><div class="dp-body">'+demo+'</div><div class="dp-cap">'+cap+'</div></aside>';
  }
  html += '</div>';
  el.innerHTML = html;
  el.querySelectorAll('[data-goto]').forEach(b=> b.addEventListener('click', ()=> openLesson(b.dataset.goto)));
  el.querySelectorAll('[data-cmp]').forEach(b=> b.addEventListener('click', ()=> openCompare(b.dataset.cmp)));
}

/* ---- 菜单 ---- */
function closeAllMenus(){
  document.querySelectorAll('.menu.open').forEach(m=> m.classList.remove('open'));
}
function renderMenus(){
  /* 菜单下拉内容已直接写在 HTML 里，这里只负责交互：点击 / 悬停展开、点击菜单项跳转 */
  $('menubar').addEventListener('click', e=>{
    const label = e.target.closest('.menu > button');
    if(label){
      e.stopPropagation();
      const menu = label.parentElement;
      const wasOpen = menu.classList.contains('open');
      const justHovered = Date.now() - (menu._hoverT || 0) < 400;
      if(wasOpen && justHovered){
        /* 触摸/快速移动场景：mouseover 刚把它展开，这次点击是"确认展开"，保持并重新定位 */
        positionMenu(menu);
      } else if(wasOpen){
        /* 已展开且非刚刚 hover：再次点击收起 */
        closeAllMenus();
      } else {
        closeAllMenus();
        menu.classList.add('open');
        positionMenu(menu);
      }
      return;
    }
    const item = e.target.closest('.dropdown button');
    if(item){
      e.stopPropagation();
      if(item.dataset.tab){
        activeTab = item.dataset.tab;
        document.querySelectorAll('.ptab').forEach(x=>x.classList.toggle('active', x.dataset.tab===activeTab));
        renderPanel();
      } else if(item.dataset.id){
        openLesson(item.dataset.id);
      } else if(item.dataset.cmp){
        openCompare(COMPARES[0].id);
      } else if(item.dataset.about){
        toast('PS 功能学习台，仿 Photoshop 界面的功能学习工具。数据为常用功能的经验整理，具体以你电脑上安装的 PS 版本为准。');
      }
      closeAllMenus();
    }
  });
  /* 悬停展开：像 PS 一样，鼠标移到菜单名上即弹出下拉，移到页面其他地方自动收起 */
  let closeTimer = null;
  $('menubar').addEventListener('mouseover', e=>{
    clearTimeout(closeTimer);
    const menu = e.target.closest('.menu');
    if(menu && menu.querySelector('.dropdown')){
      menu._hoverT = Date.now();
      closeAllMenus();
      menu.classList.add('open');
      positionMenu(menu);
    }
  });
  document.addEventListener('mouseover', e=>{
    if(!e.target.closest('#menubar')){
      clearTimeout(closeTimer);
      closeTimer = setTimeout(closeAllMenus, 160);
    }
  });
  document.addEventListener('click', closeAllMenus);
}

/* 下拉菜单固定定位：脱离菜单栏滚动容器的裁切，贴边自动收拢、超高自动滚动 */
function positionMenu(menu){
  const btn = menu.querySelector('.menu > button');
  const drop = menu.querySelector('.dropdown');
  if(!btn || !drop) return;
  const rect = btn.getBoundingClientRect();
  const w = drop.offsetWidth || 180;
  let left = rect.left;
  if(left + w > window.innerWidth - 8) left = Math.max(8, window.innerWidth - w - 8);
  drop.style.left = left + 'px';
  drop.style.top = Math.round(rect.bottom + 2) + 'px';
  drop.style.maxHeight = Math.max(160, window.innerHeight - rect.bottom - 14) + 'px';
  drop.style.overflowY = 'auto';
}

  pcItem('liquify',1,1,0,'X','Ctrl+Shift+X')

const pcState = {queue:[], idx:0, right:0, wrong:0, missed:false, locked:false, timer:null};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function openPractice(){
  pcState.queue = shuffle(PRACTICE_KEYS);
  pcState.idx = 0; pcState.right = 0; pcState.wrong = 0;
  pcState.missed = false; pcState.locked = false;
  if(pcState.timer){ clearTimeout(pcState.timer); pcState.timer=null; }
  $('practice').classList.add('on');
  renderPractice();
}
function closePractice(){
  $('practice').classList.remove('on');
  if(pcState.timer){ clearTimeout(pcState.timer); pcState.timer=null; }
  pcState.locked = false;
}
function pcEventMatch(e, item){
  if((e.key||'').length!==1) return false;
  if(e.key.toUpperCase() !== item.key) return false;
  return (e.ctrlKey||e.metaKey)===item.ctrl && e.shiftKey===item.shift && e.altKey===item.alt;
}
function renderPractice(){
  const el = $('practice');
  if(pcState.idx >= pcState.queue.length){ el.innerHTML = renderPracticeDone(); return; }
  const item = pcState.queue[pcState.idx];
  const t = TOOLS[item.id];
  const total = pcState.queue.length;
  let html = '<div class="pc-box"><div class="pc-top"><span class="pc-title">快捷键练习</span>';
  html += '<span class="pc-prog">'+(pcState.idx+1)+' / '+total+'</span>';
  html += '<button class="pc-exit" onclick="closePractice()">退出</button></div>';
  html += '<div class="pc-qname">'+(t?t.name:item.id)+'</div>';
  html += '<div class="pc-qen">'+(t?t.en:'')+'</div>';
  html += '<div class="pc-feedback" id="pcFeedback" style="border-color:transparent"></div>';
  html += '<div class="pc-stats"><span>正确 <b>'+pcState.right+'</b></span><span>错误 <b>'+pcState.wrong+'</b></span>';
  html += '<span>正确率 <b>'+pcRate()+'</b></span></div>';
  html += '<div class="pc-actions"><button class="pc-btn" onclick="pcSkip()">跳过</button>';
  html += '<button class="pc-btn primary" onclick="closePractice()">结束练习</button></div></div>';
  el.innerHTML = html;
}
function pcRate(){
  const done = pcState.right + pcState.wrong;
  return done ? Math.round(pcState.right*100/done)+'%' : '—';
}
function renderPracticeDone(){
  const total = pcState.queue.length;
  const rate = total ? Math.round(pcState.right*100/total) : 0;
  let html = '<div class="pc-box"><div class="pc-done"><div class="pc-top"><span class="pc-title">练习完成</span>';
  html += '<button class="pc-exit" onclick="closePractice()">退出</button></div>';
  html += '<div class="pc-qname">本轮成绩</div>';
  html += '<div class="pc-score-big">'+rate+'<small>%</small></div>';
  html += '<div class="pc-donehint">共 '+total+' 题 · 正确 '+pcState.right+' · 错误 '+pcState.wrong+'</div>';
  html += '<div class="pc-actions"><button class="pc-btn primary" onclick="openPractice()">再来一轮</button>';
  html += '<button class="pc-btn" onclick="closePractice()">返回学习台</button></div></div></div>';
  return html;
}
function pcNext(){
  if(pcState.timer){ clearTimeout(pcState.timer); pcState.timer=null; }
  pcState.idx++; pcState.missed=false; pcState.locked=false;
  renderPractice();
}
function pcSkip(){
  if(pcState.locked) return;
  pcNext();
}
function pcHandleKey(e){
  if(!$('practice').classList.contains('on')) return;
  if(e.key==='Escape'){ e.preventDefault(); closePractice(); return; }
  if(pcState.idx >= pcState.queue.length){
    if(e.key==='Enter'){ e.preventDefault(); openPractice(); }
    return;
  }
  if(pcState.locked) { e.preventDefault(); return; }
  const item = pcState.queue[pcState.idx];
  const fb = $('pcFeedback');
  if(pcEventMatch(e,item)){
    e.preventDefault();
    if(!pcState.missed) pcState.right++;
    pcState.locked = true;
    fb.className = 'pc-feedback ok';
    fb.innerHTML = '回答正确 <span class="pc-answer">'+item.label+'</span>';
    pcRefreshStats();
    pcState.timer = setTimeout(pcNext, 850);
  } else if((e.key||'').length===1){
    e.preventDefault();
    if(!pcState.missed){ pcState.wrong++; pcState.missed=true; }
    fb.className = 'pc-feedback no';
    fb.innerHTML = '再想想，正确快捷键是 <span class="pc-answer">'+item.label+'</span>';
    pcRefreshStats();
  }
}
function pcRefreshStats(){
  const stats = document.querySelector('.pc-stats');
  if(stats){
    stats.innerHTML = '<span>正确 <b>'+pcState.right+'</b></span><span>错误 <b>'+pcState.wrong+'</b></span><span>正确率 <b>'+pcRate()+'</b></span>';
  }
}
document.addEventListener('keydown', pcHandleKey);

  '锐化':'锐化','模糊':'高斯模糊','虚':'高斯模糊',
  '拼图':'自动对齐','全景':'自动对齐','接片':'自动对齐','合成':'自动对齐',
  '修图':'曲线','p图':'曲线'
};
function normalizeQuery(raw){
  let q = String(raw||'').trim().toLowerCase();
  q = q.replace(/\s+/g,'');
  q = q.replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
  return q;
}
function arrLike(v){ return Array.isArray(v) ? v : (v ? [v] : []); }
function toolHaystack(t){
  return (t.name+' '+t.en+' '+(t.key||'')+' '+t.cat+' '+t.desc+' '+arrLike(t.when).join(' ')).toLowerCase();
}
/* 子序列匹配：q 各字符按顺序出现在 s 中即可，容忍错字 / 夹杂 / 顺序偏差 */
function fuzzySubseq(q, s){
  if(q.length<2) return false;
  let i=0;
  for(let j=0;j<s.length && i<q.length;j++){ if(s[j]===q[i]) i++; }
  return i===q.length;
}
function searchScore(q, t){
  const s = toolHaystack(t);
  if(s.indexOf(q)===0) return 100;
  if(s.indexOf(q)>-1) return 80;
  const aliasQ = SEARCH_ALIAS[q];
  if(aliasQ){
    if(s.indexOf(aliasQ)===0) return 75;
    if(s.indexOf(aliasQ)>-1) return 70;
  }
  if(fuzzySubseq(q, s)) return 45;
  return 0;
}
/* ---- 历史记录 ---- */
function getHistory(){
  try{ return JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }catch(e){ return []; }
}
function addHistory(term){
  if(!term) return;
  let list = getHistory().filter(x=>x!==term);
  list.unshift(term);
  try{ localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0,8))); }catch(e){}
}
function removeHistory(term){
  try{ localStorage.setItem(HIST_KEY, JSON.stringify(getHistory().filter(x=>x!==term))); }catch(e){}
}
function clearHistory(){ try{ localStorage.removeItem(HIST_KEY); }catch(e){} }
/* ---- 下拉定位 / 公共绑定 ---- */
function positionDrop(){
  const r = $('searchInput').getBoundingClientRect();
  const w = Math.min(330, window.innerWidth-20);
  const drop = $('searchDrop');
  drop.style.width=w+'px';
  drop.style.left=Math.min(r.left, Math.max(8, window.innerWidth-w-8))+'px';
  drop.style.top=Math.round(r.bottom+2)+'px';
  drop.style.maxHeight=Math.max(120, window.innerHeight-r.bottom-14)+'px';
}
function bindOpenItems(container){
  container.querySelectorAll('.sr-item,.sr-hot').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id=b.dataset.id;
      if(!id || !TOOLS[id]) return;
      addHistory(b.dataset.term || TOOLS[id].name);
      $('searchInput').value='';
      $('searchDrop').classList.remove('on');
      openLesson(id);
    });
  });
}
function renderSearch(){
  const raw = $('searchInput').value;
  const q = normalizeQuery(raw);
  const drop = $('searchDrop');
  if(!q){ renderSearchLanding(); return; }
  let hits = [];
  Object.values(TOOLS).forEach(t=>{
    const sc = searchScore(q, t);
    if(sc>0) hits.push({t, sc});
  });
  INTENTS.forEach(it=>{
    it.k.forEach(k=>{ if(q.indexOf(k.toLowerCase())>-1 || k.toLowerCase().indexOf(q)>-1){ it.t.forEach(id=>{ if(TOOLS[id] && !hits.find(h=>h.t.id===id)) hits.push({t:TOOLS[id], sc:60}); }); } });
  });
  hits.sort((a,b)=> b.sc-a.sc);
  hits = hits.slice(0,10);
  let html;
  if(hits.length){
    html = hits.map(h=> '<div class="sr-item" data-id="'+h.t.id+'" data-term="'+raw.trim()+'">'+h.t.name+'<span class="sr-k">'+(h.t.key||h.t.cat)+'</span></div>').join('');
  } else {
    html = '<div class="sr-empty">没有找到「'+raw.trim()+'」。试试「抠图 / 去水印 / 调色」等关键词</div>';
  }
  drop.innerHTML = html;
  positionDrop();
  drop.classList.add('on');
  bindOpenItems(drop);
}
/* 空查询：历史搜索 + 热门功能 */
function renderSearchLanding(){
  const drop = $('searchDrop');
  const hist = getHistory();
  let html = '';
  if(hist.length){
    html += '<div class="sr-group">历史搜索<span class="sr-clear" data-clear="1">清空</span></div>';
    html += hist.map(term=> '<div class="sr-hist" data-term="'+term+'">'+term+'<span class="sr-del" data-del="'+term+'">×</span></div>').join('');
  }
  html += '<div class="sr-group">热门功能</div>';
  html += HOT_TOOLS.filter(id=>TOOLS[id]).map(id=> '<div class="sr-hot" data-id="'+id+'"><span class="sr-fire">●</span>'+TOOLS[id].name+'<span class="sr-k">'+(TOOLS[id].key||'')+'</span></div>').join('');
  drop.innerHTML = html;
  positionDrop();
  drop.classList.add('on');
  const clearBtn = drop.querySelector('[data-clear]');
  if(clearBtn) clearBtn.addEventListener('click', e=>{ e.stopPropagation(); clearHistory(); renderSearchLanding(); });
  drop.querySelectorAll('.sr-del').forEach(b=> b.addEventListener('click', e=>{
    e.stopPropagation();
    removeHistory(b.dataset.del);
    renderSearchLanding();
  }));
  /* 历史词点击：回填并重新执行该搜索 */
  drop.querySelectorAll('.sr-hist').forEach(b=> b.addEventListener('click', e=>{
    if(e.target.classList.contains('sr-del')) return;
    $('searchInput').value = b.dataset.term;
    renderSearch();
  }));
  bindOpenItems(drop);
}

/* ---- 不知道用什么 ---- */
function openGuide(){
  $('guideModal').classList.add('open');
  $('guideInput').focus();
  renderCatChips();
}
function closeGuide(){ $('guideModal').classList.remove('open'); }
function renderCatChips(){
  const el = $('catChips');
  let html = '';
  CATS.forEach(c=>{
    html += '<button class="cat-chip'+(activeCat===c.id?' active':'')+'" data-cat="'+c.id+'">'+c.name+'</button>';
  });
  el.innerHTML = html;
  el.querySelectorAll('.cat-chip').forEach(b=>{
    b.addEventListener('click', ()=>{
      activeCat = (activeCat===b.dataset.cat ? null : b.dataset.cat);
      renderCatChips();
      renderGuideCats();
    });
  });
}
function renderGuideCats(){
  const out = $('guideResult');
  if(!activeCat){ out.innerHTML = ''; return; }
  const c = CATS.find(x=>x.id===activeCat);
  let html = '<div class="g-label">「'+c.name+'」适用功能：</div><div class="g-result">';
  c.tools.forEach(id=>{
    const t = TOOLS[id];
    html += '<div class="g-tool" data-id="'+id+'"><div class="g-ic">'+(ICONS[t.icon]||'')+'</div><div><div class="g-t">'+t.name+' <span style="color:#999;font-weight:400;font-size:11.5px">'+t.en+'</span></div><div class="g-w">'+t.desc+'</div></div><span class="g-k">'+(t.key||'')+'</span></div>';
  });
  html += '</div>';
  out.innerHTML = html;
  out.querySelectorAll('.g-tool').forEach(b=> b.addEventListener('click', ()=>{ closeGuide(); openLesson(b.dataset.id); }));
}
function matchGuide(){
  const q = $('guideInput').value.trim().toLowerCase();
  const out = $('guideResult');
  activeCat = null; renderCatChips();
  if(!q){ out.innerHTML = '<div class="g-none">请输入你想做的事，例如：照片发黄怎么调、怎么把背景去掉、想去掉水印。</div>'; return; }
  const score = {};
  const why = {};
  INTENTS.forEach(it=>{
    const hit = it.k.some(k=> q.indexOf(k.toLowerCase())>-1);
    if(hit){
      it.t.forEach(id=>{
        if(!TOOLS[id]) return;
        score[id] = (score[id]||0) + 1;
        if(!why[id]) why[id] = it.w;
      });
    }
  });
  if(activeCat) renderGuideCats();
  const ids = Object.keys(score).sort((a,b)=> score[b]-score[a]).slice(0,8);
  if(!ids.length){
    out.innerHTML = '<div class="g-none">没匹配到明确的功能。试试换个说法：<br>抠图 / 去背景 / 换背景<br>去水印 / 去文字 / 去杂物<br>照片发黄 / 偏色 / 发灰<br>瘦脸 / 磨皮 / 红眼<br>加文字 / 排版对齐<br>导出 PNG / 压缩图片<br>也可以点击上方分类浏览。</div>';
    return;
  }
  let html = '<div class="g-label">根据你的描述，推荐这些功能：</div><div class="g-result">';
  ids.forEach(id=>{
    const t = TOOLS[id];
    html += '<div class="g-tool" data-id="'+id+'"><div class="g-ic">'+(ICONS[t.icon]||'')+'</div><div><div class="g-t">'+t.name+' <span style="color:#999;font-weight:400;font-size:11.5px">'+t.en+'</span></div><div class="g-w">'+(why[id]||t.desc)+'</div></div><span class="g-k">'+(t.key||'')+'</span></div>';
  });
  html += '</div>';
  out.innerHTML = html;
  out.querySelectorAll('.g-tool').forEach(b=> b.addEventListener('click', ()=>{ closeGuide(); openLesson(b.dataset.id); }));
}

/* ---- 状态栏 ---- */
function renderZoom(){
  $('zoomBtn').textContent = Math.round(zoom*100)+'%';
  $('doc').style.transform = 'scale('+zoom+')';
}
function nextTip(){
  tipIdx = (tipIdx+1) % TIPS.length;
  const el = $('tipText');
  el.classList.add('swap');
  setTimeout(()=>{ el.textContent = '提示：'+TIPS[tipIdx]; el.classList.remove('swap'); }, 300);
}

/* ---- 提示 ---- */
let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('on'), 2600);
}

/* ---- 事件 ---- */
$('optBtn').addEventListener('click', ()=>{ if(current) openLesson(current); });
$('guideBtn').addEventListener('click', openGuide);
$('panelToggle').addEventListener('click', ()=>{ $('panel').classList.toggle('open'); });
$('searchInput').addEventListener('input', renderSearch);
/* 聚焦且为空时，展示历史搜索与热门功能 */
$('searchInput').addEventListener('focus', ()=>{ if(!normalizeQuery($('searchInput').value)) renderSearchLanding(); });
/* 点击页面空白处收起搜索下拉 */
document.addEventListener('mousedown', e=>{
  if(!$('searchWrap').contains(e.target)) $('searchDrop').classList.remove('on');
});
/* 工具栏单列 / 双列切换（同 PS 工具栏顶部的双箭头按钮） */
function applyCols(single, silent){
  $('app').classList.toggle('cols-single', single);
  $('colToggle').classList.toggle('on', single);
  /* 图标随状态变化：单列显示「展开双列」箭头，双列显示「收拢单列」箭头（同 PS） */
  $('colIcon').innerHTML = single
    ? '<path d="M8 6v12M16 6v12" opacity=".55"/><path d="M3 5l3 3 3-3M3 19l3-3 3 3" opacity=".9"/>'
    : '<path d="M8 6v12M16 6v12" opacity=".55"/><path d="M15 5l-3 3 3 3M15 19l-3-3 3-3" opacity=".9"/>';
  try{ localStorage.setItem('ps_learn_toolcols', single?'1':'0'); }catch(e){}
  if(!silent) toast(single ? '已切换为单列工具栏' : '已切换为双列工具栏（同 PS）');
}
$('colToggle').addEventListener('click', ()=>{
  applyCols(!$('app').classList.contains('cols-single'));
});
$('searchInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const f = $('searchDrop').querySelector('.sr-item,.sr-hot');
    if(f){
      const id=f.dataset.id;
      if(id && TOOLS[id]){
        addHistory($('searchInput').value.trim() || TOOLS[id].name);
        $('searchInput').value='';
        $('searchDrop').classList.remove('on');
        openLesson(id);
      }
    }
  }
  if(e.key==='Escape'){ $('searchDrop').classList.remove('on'); }
});
$('guideInput').addEventListener('keydown', e=>{ if(e.key==='Enter') matchGuide(); });
$('zoomBtn').addEventListener('click', ()=>{ const seq=[1,2,0.5]; const i=seq.indexOf(zoom); zoom = seq[(i+1)%seq.length]; renderZoom(); });
document.addEventListener('keydown', e=>{
  if($('practice').classList.contains('on')) return;
  if(e.key==='Escape'){ closeGuide(); closeAllMenus(); $('searchDrop').classList.remove('on'); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); $('searchInput').focus(); }
});
$('guideModal').addEventListener('click', e=>{ if(e.target.id==='guideModal') closeGuide(); });

/* 工具栏悬浮提示：fixed 浮层，超出视口自动收拢，避免被滚动容器裁切 */
(function(){
  const tip = $('toolTip');
  function showTip(b){
    tip.textContent = b.dataset.tip;
    tip.style.display = 'block';
    const r = b.getBoundingClientRect();
    tip.style.top = Math.max(6, r.top + (r.height - tip.offsetHeight)/2) + 'px';
    let left = r.right + 8;
    if(left + tip.offsetWidth > window.innerWidth - 6) left = Math.max(6, r.left - tip.offsetWidth - 8);
    tip.style.left = left + 'px';
  }
  function hideTip(e){
    if(!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.tool-btn')) tip.style.display = 'none';
  }
  $('toolScroll').addEventListener('mouseover', e=>{ const b = e.target.closest('.tool-btn'); if(b) showTip(b); });
  $('toolScroll').addEventListener('mouseout', hideTip);
})();

/* ---- 启动 ---- */
function init(){
  try{ if(localStorage.getItem('ps_learn_toolcols')==='1') applyCols(true, true); }catch(e){}
  renderToolbar();
  try{
    if(localStorage.getItem('ps_learn_coltip')!=='1' && window.innerWidth>860){
      localStorage.setItem('ps_learn_coltip','1');
      setTimeout(()=>toast('工具栏顶部 ⇄ 按钮：点击可切换 单列 / 双列（同 PS 软件）'), 2400);
    }
  }catch(e){}
  renderPanel();
  renderMenus();
  renderCanvas();
  renderOptions();
  renderZoom();
  $('tipText').textContent = '提示：'+TIPS[0];
  setInterval(nextTip, 9000);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    const sp0 = $('splash');
    sp0.style.display = 'none';
    if(sp0.parentNode) sp0.parentNode.removeChild(sp0);
    $('app').classList.add('on');
    return;
  }
  setTimeout(()=>{
    const sp = $('splash');
    sp.classList.add('hide');
    $('app').classList.add('on');
    /* 淡出过渡结束后彻底移除 DOM，杜绝任何环境下的残留 */
    setTimeout(()=>{ if(sp.parentNode) sp.parentNode.removeChild(sp); }, 620);
  }, 1650);
}
/* splash 兜底：即使主流程异常，也在数秒后强制移除启动画面 */
document.addEventListener('DOMContentLoaded', ()=>{
  setTimeout(()=>{
    const sp = $('splash');
    if(sp && !sp.classList.contains('hide')) sp.classList.add('hide');
  }, 4000);
  setTimeout(()=>{
    const sp = $('splash');
    if(sp && sp.parentNode) sp.parentNode.removeChild(sp);
  }, 4800);
});
init();
</script>
